<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PhishShield AI</title>
    <style>
        body {
            width: 320px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
        }
        h2 {
            margin-top: 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .url-box {
            background: #e2e8f0;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            word-wrap: break-word;
            margin-bottom: 15px;
            color: #475569;
        }
        button {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        
        #resultBox {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 13px;
        }
        .safe { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .score { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .loader {
            display: none;
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <h2>🛡️ PhishShield Scanner</h2>
    <div class="url-box" id="currentUrl">Loading URL...</div>
    <button id="scanBtn">Analyze Current Page</button>
    <div id="loader" class="loader">Scanning deep heuristics...</div>
    <div id="resultBox"></div>
    <script src="popup.js"></script>
</body>
</html>
