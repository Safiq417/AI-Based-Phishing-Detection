{% extends 'layout.html' %}
{% block content %}
<div class="max-w-md mx-auto card p-8 mt-12">
    <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-slate-800">Welcome Back</h2>
        <p class="text-sm text-slate-500 mt-1">Sign in to access the security gateway</p>
    </div>
    <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
        <div>
            <label class="block text-sm font-semibold mb-1 text-slate-700">Username</label>
            <input type="text" name="username" required class="input-field" placeholder="admin">
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1 text-slate-700">Password</label>
            <input type="password" name="password" required class="input-field" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary mt-2">Sign In</button>
    </form>
    <p class="mt-6 text-sm text-center text-slate-500">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-blue-600 font-semibold hover:underline">Register here</a>
    </p>
</div>
{% endblock %}
